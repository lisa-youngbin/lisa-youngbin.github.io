<footer style="text-align: center; padding: 2rem 0; color: var(--text-color, #666); font-size: 0.9em;">
  <button id="theme-toggle" onclick="modeToggle()" style="background: none; border: 1px solid #888; color: inherit; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-bottom: 1rem;">
    🌙 Dark Mode
  </button>
  <p>© {{ 'now' | date: "%Y" }} Lisa Kim. All rights reserved.</p>
</footer>

<script>
  function modeToggle() {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    if (currentTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "light");
      localStorage.setItem("theme", "light");
      document.getElementById("theme-toggle").innerText = "🌙 Dark Mode";
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      localStorage.setItem("theme", "dark");
      document.getElementById("theme-toggle").innerText = "☀️ Light Mode";
    }
  }

  // Apply saved theme preference on page load
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("theme-toggle").innerText = "☀️ Light Mode";
  }
</script>
