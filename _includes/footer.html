<footer style="text-align: center; padding: 2rem 0; font-size: 0.9em;">
  <button id="theme-toggle" onclick="modeToggle()" style="background: none; border: 1px solid #888; color: inherit; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-bottom: 1rem;">
    🌙 Dark Mode
  </button>
  <p>© {{ 'now' | date: "%Y" }} Lisa Kim. </p>
</footer>

<style>
  /* Global CSS Variables for Dark Mode */
  html[data-theme="dark"], 
  html[data-theme="dark"] body,
  html[data-theme="dark"] .site-header,
  html[data-theme="dark"] .site-footer,
  html[data-theme="dark"] .page-content {
    background-color: #121212 !important;
    color: #e0e0e0 !important;
  }

  html[data-theme="dark"] a,
  html[data-theme="dark"] .site-title,
  html[data-theme="dark"] .page-link {
    color: #64b5f6 !important;
  }

  html[data-theme="dark"] hr {
    border-top-color: #333 !important;
  }
</style>

<script>
  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      const btn = document.getElementById("theme-toggle");
      if (btn) btn.innerText = "☀️ Light Mode";
    } else {
      document.documentElement.setAttribute("data-theme", "light");
      const btn = document.getElementById("theme-toggle");
      if (btn) btn.innerText = "🌙 Dark Mode";
    }
  }

  function modeToggle() {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", newTheme);
    applyTheme(newTheme);
  }

  // Initialize theme immediately on script execution
  (function() {
    const savedTheme = localStorage.getItem("theme");
    const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    
    if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
      applyTheme("dark");
    } else {
      applyTheme("light");
    }
  })();
</script>
